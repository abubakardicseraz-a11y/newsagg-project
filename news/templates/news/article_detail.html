{% extends 'news/base.html' %}
{% block title %}{{ article.title }}{% endblock %}
{% block content %}

<a href="{% url 'home' %}" style="font-family: var(--font-sans); font-size: 13px; color: var(--text-secondary); text-decoration: none;">&larr; Back to feed</a>

<div style="margin-top: 20px;">
    <span class="source-badge" style="background: {{ article.badge_color }};">{{ article.source }}</span>
</div>
<h1 style="font-size: 32px; font-weight: 600; margin: 12px 0 28px; line-height: 1.25;">{{ article.title }}</h1>

<div style="font-size: 18px; color: #3A3630;">{{ article.content|striptags }}</div>

<a href="{{ article.url }}" target="_blank" style="display: inline-block; margin-top: 32px; font-family: var(--font-sans); font-size: 14px; border: 1px solid var(--text); border-radius: 4px; padding: 10px 18px; text-decoration: none; color: var(--text);">Read full article at source &rarr;</a>

{% endblock %}
