{% extends 'news/base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}

<div style="max-width: 360px; margin: 40px auto 0;">
    <h1 style="font-size: 26px; font-weight: 600; margin-bottom: 24px;">Log in</h1>
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 16px; font-family: var(--font-sans); font-size: 13px;">
            {{ form.username.label_tag }}<br>
            <input type="text" name="username" style="width: 100%; padding: 10px; margin-top: 6px; border: 1px solid var(--border); border-radius: 4px; font-family: var(--font-sans); font-size: 14px;" required>
        </div>
        <div style="margin-bottom: 20px; font-family: var(--font-sans); font-size: 13px;">
            {{ form.password.label_tag }}<br>
            <input type="password" name="password" style="width: 100%; padding: 10px; margin-top: 6px; border: 1px solid var(--border); border-radius: 4px; font-family: var(--font-sans); font-size: 14px;" required>
        </div>
        <button type="submit" style="width: 100%; padding: 12px; background: var(--text); color: var(--bg); border: none; border-radius: 4px; font-family: var(--font-sans); font-size: 14px; cursor: pointer;">Log in</button>
    </form>
    <p style="font-family: var(--font-sans); font-size: 13px; color: var(--text-secondary); margin-top: 20px;">
        <a href="{% url 'signup' %}" style="color: var(--accent);">Don't have an account? Sign up</a>
    </p>
</div>

{% endblock %}
